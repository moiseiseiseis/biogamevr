  { lead: 1.0, tail: 1.6, lines: [
    ['OPERADORA', 'ESPERA... ESTA SECUENCIA NO COINCIDE CON LA QUE ESTÁBAMOS PROCESANDO.'],
    ['ASTRA', 'SUSTITUCIÓN EN LA POSICIÓN 20: LA SERINA FUE REEMPLAZADA POR GLICINA. VARIANTE S20G.'],
    ['ASTRA', 'UN SOLO CAMBIO DE BASE EN EL GEN DEL IAPP: EL CODÓN AGC SE CONVIERTE EN GGC.'],
    ['ASTRA', 'ACELERANDO EL TIEMPO... LA VARIANTE FORMA FIBRAS AMILOIDES MÁS RÁPIDO QUE LA ORIGINAL.']],
    draw(t, S) {
      R(0, 0, W, H, '#0b0c12'); for (let x = 0; x < W; x += 10) R(x, 0, 1, 128, '#14110a');
      hudPanel(6, 6, 308, 112);
      const x0 = 12, step = 8, rowA = 22, rowB = 42, mark = t > S.L[1] - 0.4;
      text('ORIGINAL', x0, 13, '#f7b32b'); text('VARIANTE', x0, 33, '#ff7ce8');
      for (let i = 0; i < 37; i++) {
        const a = AMILINA[i], b = i === 19 ? 'G' : a, rev = seg(t, 0.2 + i * 0.03, 0.4 + i * 0.03);
        if (rev <= 0) continue;
        text(a, x0 + i * step, rowA, AA_COL[a]);
        const bc = i === 19 && mark ? (Math.floor(t * 4) % 2 ? '#ff4a3a' : '#ffffff') : AA_COL[b]; text(b, x0 + i * step, rowB, bc);
      }
      if (mark) { const bx = x0 + 19 * step - 2, c = Math.floor(t * 4) % 2 ? '#ff4a3a' : '#f7b32b'; R(bx, rowA - 3, 9, 1, c); R(bx, rowB + 9, 9, 1, c); R(bx, rowA - 3, 1, rowB - rowA + 13, c); R(bx + 8, rowA - 3, 1, rowB - rowA + 13, c); text('20', bx - 1, rowB + 12, c); }
      if (t > S.L[2] && t < S.L[3]) { const p = ease(seg(t, S.L[2], S.L[2] + 0.6)); clipRect(0, 64, W * p, 40, () => { textC('SERINA (S20)  →  GLICINA (G20)', 160, 70, '#ffffff'); text('AGC', 112, 86, '#ffffff', 2); text('→', 152, 86, '#f7b32b', 2); text('GGC', 172, 86, '#ffffff', 2); R(112, 86, 10, 14, D('#ff4a3a', 6)); R(172, 86, 10, 14, D('#ff4a3a', 6)); }); }
      if (t >= S.L[3]) {
        const tt = t - S.L[3];
        for (const [side, cx, rate, label, c] of [[0, 84, 0.9, 'ORIGINAL', '#f7b32b'], [1, 236, 2.6, 'S20G', '#ff7ce8']]) {
          R(cx - 68, 62, 136, 1, D(c, 6)); text(label, cx - tw(label) / 2, 104, c);
          const n = Math.min(10, Math.floor(tt * rate));
          for (let i = 0; i < n; i++) { const y = 96 - i * 4; for (let k = 0; k < 12; k++) { R(cx - 18 + k * 3, y + (k % 2), 2, 1, c); } R(cx - 18, y + 2, 36, 1, D(c, 5)); }
          for (let i = n; i < 10; i++) { const a = i * 2.1 + tt * 0.8, r = 26 + (i % 3) * 8; const x = cx + Math.cos(a) * r * 1.9, y = 82 + Math.sin(a) * r * 0.5; for (let k = 0; k < 5; k++) R(x + k * 3, y + ((k + Math.floor(tt * 4)) % 2), 2, 1, c); }
        }
        textC('FIBRAS AMILOIDES', 160, 70, '#ffffff');
      }
    } },
  /* 13 · Cierre */
  { lead: 1.2, tail: 1.4, lines: [
    ['OPERADORA', 'ASTRA, ¿HEMOS ENCONTRADO LA CAUSA DE LA ANOMALÍA?'],
    ['ASTRA', 'IDENTIFICAMOS UNA VARIACIÓN EN LA AMILINA Y SU AGREGACIÓN. PRIMERA ETAPA DE EXPLORACIÓN COMPLETADA.'],
    [null, 'SI UN SOLO AMINOÁCIDO PUEDE CAMBIARLO TODO... ¿QUÉ OTRAS SEÑALES NOS ESPERAN MÁS ALLÁ DE ESTA CÉLULA?']],
    draw(t, S) {
      cabin(t, tt => {
        E(160, 50, 56, 36, '#3a2a10'); arc(160, 50, 56, 36, '#f7b32b'); arc(160, 50, 54, 34, D('#f7b32b', 6)); E(176, 44, 14, 11, '#5c3f12'); arc(176, 44, 14, 11, '#c97a12');
        for (const [x, n, c] of [[132, 4, '#f7b32b'], [190, 10, '#ff7ce8']]) for (let i = 0; i < n; i++) { const y = 70 - i * 3; for (let k = 0; k < 6; k++) P(x - 8 + k * 3, y + (k % 2), c); }
        hudPanel(32, 14, 70, 34); text('REGISTRO', 38, 18, '#f7b32b'); const p = seg(tt, S.L[1], S.L[1] + 3.5); R(38, 30, 58, 6, '#1b1f33'); R(39, 31, 56 * p, 4, '#f7b32b'); text(p < 1 ? Math.round(p * 100) + '%' : 'GUARDADO', 38, 38, '#fff3a0');
        hudPanel(222, 14, 66, 34); text('ETAPA 1', 228, 18, '#f7b32b'); text(p < 1 ? '...' : 'OK', 228, 30, p < 1 ? '#c97a12' : '#7ee07e');
      }, talking(S, t, 'ASTRA') ? 'scan' : 'idle');
    } },
  /* 14 · Continuará */
  { lead: 6.0, lines: [], draw(t) {
    R(0, 0, W, H, '#05060c'); stars(t, 120);
    const x = lerp(-40, 360, seg(t, 0, 5.5)), y = 70 + Math.sin(t * 2) * 8; for (let i = 0; i < 18; i++) P(x - 22 - i * 4, y + Math.sin(t * 6 + i) * 2, i % 2 ? '#5ff0e6' : '#ff7ce8'); mecha(x, y, 28, t, { legs: false });
    if (t > 0.8) { const s = 'CONTINUARÁ...', n = Math.floor((t - 0.8) * 10); textC([...s].slice(0, n).join(''), 160, 104, '#ffffff', 2, '#2a2f48'); }
    if (t > 2.4) textC(GAME + '  ·  ' + CODENAME, 160, 140, '#5a6988');
  } }
];

/* ---------- línea de tiempo ---------- */
let TOTAL = 0;
for (const S of SCENES) {
  S.L = []; S.E = []; let t = S.lead || 0;
  for (const [, txt] of S.lines) { S.L.push(t); t += lineDur(txt); S.E.push(t); }
  S.dur = t + (S.tail || 0); S.start = TOTAL; TOTAL += S.dur;
}
function render(T) {
  T = ((T % TOTAL) + TOTAL) % TOTAL;
  let S = SCENES[0]; for (const s of SCENES) if (T >= s.start) S = s;
  const t = T - S.start; _c = null; g.imageSmoothingEnabled = false;
  R(0, 0, W, H, '#000');
  S.draw(t, S);
  if (S.banner) banner(S.banner, t);
  drawDialog(S, t);
  const a = Math.min(1, t / 0.5, (S.dur - t) / 0.5); if (a < 1) R(0, 0, W, H, D('#000000', (1 - a) * 16));
  return T;
}

/* ---------- presentación ---------- */
const params = new URLSearchParams(location.search);
function blit(scale) { octx.imageSmoothingEnabled = false; octx.drawImage(buf, 0, 0, W * scale, H * scale); }
if (params.has('export')) {
  // Modo de exportación: entrega cuadros 320×180 RGBA al servidor local.
  out.width = W; out.height = H; document.body.classList.remove('play');
  (async () => {
    const fps = +(params.get('fps') || 30), N = Math.ceil(TOTAL * fps), B = 15;
    await fetch('/info', { method: 'POST', body: JSON.stringify({ frames: N, fps, total: TOTAL }) });
    for (let f = 0; f < N; f += B) {
      const n = Math.min(B, N - f), chunk = new Uint8Array(W * H * 4 * n);
      for (let k = 0; k < n; k++) { render((f + k) / fps); chunk.set(g.getImageData(0, 0, W, H).data, k * W * H * 4); }
      await fetch('/frames', { method: 'POST', body: chunk });
    }
    await fetch('/done', { method: 'POST' });
  })();
} else {
  let scale = 1;
  function fit() { const dpr = window.devicePixelRatio || 1, ww = innerWidth * dpr, wh = innerHeight * dpr; let s = Math.min(ww / W, wh / H); if (s >= 2) s = Math.floor(s); scale = s; out.width = Math.round(W * s); out.height = Math.round(H * s); out.style.width = out.width / dpr + 'px'; out.style.height = out.height / dpr + 'px'; }
  addEventListener('resize', fit); fit();
  let T0 = performance.now(), paused = false, pT = 0;
  if (params.has('t')) T0 -= +params.get('t') * 1000;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (paused) pT = (performance.now() - T0) / 1000; else T0 = performance.now() - pT * 1000; }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const now = paused ? pT : (performance.now() - T0) / 1000, T = ((now % TOTAL) + TOTAL) % TOTAL; let i = SCENES.findIndex(s => T >= s.start && T < s.start + s.dur); i = (i + (e.code === 'ArrowRight' ? 1 : SCENES.length - 1)) % SCENES.length; const nt = SCENES[i].start + 0.01 + Math.floor(now / TOTAL) * TOTAL; if (paused) pT = nt; else T0 = performance.now() - nt * 1000; }
    if (e.code === 'KeyF') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  });
  addEventListener('dblclick', () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); });
  (function loop() { const now = window.__fixedT != null ? window.__fixedT : paused ? pT : (performance.now() - T0) / 1000; render(now); blit(scale); requestAnimationFrame(loop); })();
  window.__seek = s => { T0 = performance.now() - s * 1000; };
  window.__scenes = () => SCENES.map((s, i) => [i, +s.start.toFixed(2), +s.dur.toFixed(2)]);
}
</script>
